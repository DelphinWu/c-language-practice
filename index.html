<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C 语言刷题系统 · 程序设计基础（第1–11章全量覆盖）</title>
<!-- highlight.js CDN（离线时自动降级为普通代码样式） -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
/* ============================================================
   设计基调：浅色护眼 · 卡片式 · 桌面优先（内容列 ≤1000px 居中）
   ============================================================ */
:root{
  --bg:#f6f7f4;
  --card:#ffffff;
  --ink:#2b3440;
  --ink-2:#5b6b7b;
  --line:#e4e8e4;
  --brand:#3d6fe0;
  --brand-deep:#2f56b8;
  --brand-soft:#e8eefb;
  --ok:#1a9e5c;
  --ok-soft:#e5f6ec;
  --bad:#d93838;
  --bad-soft:#fdecec;
  --gold:#b8860b;
  --gold-soft:#faf3df;
  --code-bg:#f7f9fb;
  --radius:14px;
  --shadow:0 1px 2px rgba(30,40,60,.05),0 6px 20px rgba(30,40,60,.06);
  --mono:"JetBrains Mono",Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.75;
}
a{color:var(--brand)}
button{font-family:inherit}

/* ---------- 顶部横幅 ---------- */
.topbar{
  background:linear-gradient(135deg,#2f56b8 0%,#3d6fe0 55%,#5a8af0 100%);
  color:#fff;padding:26px 20px 22px;
}
.topbar-inner{max-width:1000px;margin:0 auto}
.topbar h1{margin:0;font-size:24px;letter-spacing:.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar h1 .tag{font-size:12px;font-weight:600;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
  padding:2px 10px;border-radius:999px;letter-spacing:1px}
.topbar .sub{margin:8px 0 14px;font-size:13.5px;opacity:.92}
.statline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13.5px}
.statline .pill{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 14px}
.pbar{flex:1;min-width:220px;height:10px;background:rgba(255,255,255,.25);border-radius:999px;overflow:hidden}
.pbar>i{display:block;height:100%;width:0;background:#8ef0b6;border-radius:999px;transition:width .4s ease}

/* ---------- 主布局：左侧章节导航 + 右侧题目 ---------- */
.layout{
  max-width:1000px;margin:22px auto 60px;padding:0 16px;
  display:flex;gap:22px;align-items:flex-start;
}
.side{
  width:212px;flex:0 0 212px;position:sticky;top:14px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:10px;font-size:13.5px;
}
.side h3{margin:6px 8px 8px;font-size:12.5px;color:var(--ink-2);letter-spacing:2px}
.nav-item{
  display:flex;align-items:center;gap:8px;width:100%;
  padding:8px 10px;border:0;background:none;border-radius:9px;cursor:pointer;
  color:var(--ink);text-align:left;min-height:40px;font-size:13.5px;
}
.nav-item:hover{background:var(--brand-soft)}
.nav-item.active{background:var(--brand);color:#fff;font-weight:600}
.nav-item .num{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item .cnt{font-size:11.5px;opacity:.75;font-family:var(--mono)}
.nav-item .dot{width:8px;height:8px;border-radius:50%;background:#cdd6e0;flex:0 0 8px}
.nav-item .dot.done-ok{background:var(--ok)}
.nav-item .dot.done-bad{background:var(--bad)}
.nav-item .dot.part{background:var(--gold)}
.side .reset{
  margin:10px 4px 4px;width:calc(100% - 8px);min-height:40px;border-radius:9px;
  border:1px dashed #d3a1a1;background:#fdf4f4;color:var(--bad);cursor:pointer;font-size:13px;
}
.side .reset:hover{background:#fbe7e7}

.main{flex:1;min-width:0}

/* ---------- 章节标题 ---------- */
.ch-head{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 22px;margin-bottom:16px;
}
.ch-head h2{margin:0 0 6px;font-size:20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ch-head .lv-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.lv-tag{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);background:#fafbfc}
.filterbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fbtn{min-height:36px;padding:4px 14px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--ink-2);cursor:pointer;font-size:13px}
.fbtn.active{background:var(--brand);border-color:var(--brand);color:#fff}

/* ---------- 等级分组 ---------- */
.lv-group{margin:20px 0 10px;display:flex;align-items:center;gap:10px}
.lv-group h3{margin:0;font-size:16px}
.lv-group .desc{font-size:12.5px;color:var(--ink-2)}
.lv-badge{font-size:12px;font-weight:700;border-radius:8px;padding:2px 10px;letter-spacing:1px}
.lv1 .lv-badge{background:var(--brand-soft);color:var(--brand-deep)}
.lv2 .lv-badge{background:var(--gold-soft);color:var(--gold)}
.lv3 .lv-badge{background:#efe6fb;color:#7a3fe0}
.lv0 .lv-badge{background:#e3f4ee;color:#0d8a5f}
.lv1 h3{color:var(--brand-deep)} .lv3 h3{color:#7a3fe0}
.lv0 h3{color:#0d8a5f}

/* ---------- 题目卡片 ---------- */
.qcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px;
}
.qcard.locked-ok{border-color:#bfe6cd}
.qcard.locked-bad{border-color:#f2c7c7}
.q-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.q-no{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink-2)}
.q-type{font-size:12px;padding:2px 10px;border-radius:999px;background:#eef1f5;color:var(--ink-2)}
.q-state{margin-left:auto;font-size:13px;font-weight:700}
.q-state.ok{color:var(--ok)} .q-state.bad{color:var(--bad)}
.stem{font-size:16px;margin:2px 0 12px}
.stem code,.explain code{background:#eef1f5;border-radius:5px;padding:1px 6px;font-family:var(--mono);font-size:14px;color:#c7254e}

/* ---------- 代码块：可横向滚动，绝不撑破屏幕 ---------- */
pre.code{
  background:var(--code-bg);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px;overflow-x:auto;margin:10px 0 4px;
  font-family:var(--mono);font-size:14px;line-height:1.65;tab-size:4;
  -webkit-overflow-scrolling:touch;
}
pre.code code{background:none;padding:0;font-size:14px}
.code-head{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.code-lang{font-size:11.5px;color:var(--ink-2);font-family:var(--mono)}

/* ---------- 填空输入框 ---------- */
.blank{display:inline-flex;align-items:center;vertical-align:middle;margin:0 2px}
.blank input{
  font-family:var(--mono);font-size:14px;color:var(--ink);
  border:1.5px dashed #9db3d8;border-radius:7px;background:#fff;
  padding:4px 8px;min-height:34px;min-width:110px;outline:none;
}
.blank input:focus{border-color:var(--brand);border-style:solid;box-shadow:0 0 0 3px rgba(61,111,224,.12)}
.blank input.ok{border:1.5px solid var(--ok);background:var(--ok-soft);color:#12683e}
.blank input.bad{border:1.5px solid var(--bad);background:var(--bad-soft);color:#8f1f1f}
.blank .bno{font-size:11px;color:#fff;background:#9db3d8;border-radius:5px 0 0 5px;padding:0 6px;margin-right:-2px}

/* ---------- 大题内：多行代码补写（textarea） ---------- */
pre.code .cline{display:block;margin:3px 0}
pre.code .cline textarea{
  width:100%;min-height:46px;font-family:var(--mono);font-size:14px;line-height:1.6;
  border:1.5px dashed #9db3d8;border-radius:8px;background:#fff;color:var(--ink);
  padding:7px 10px;resize:vertical;outline:none;white-space:pre;overflow-x:auto;
}
pre.code .cline textarea:focus{border-color:var(--brand);border-style:solid;box-shadow:0 0 0 3px rgba(61,111,224,.12)}
pre.code .cline.ok textarea{border:1.5px solid var(--ok);background:var(--ok-soft);color:#12683e}
pre.code .cline.bad textarea{border:1.5px solid var(--bad);background:var(--bad-soft);color:#8f1f1f}
.g-ans{margin-top:14px;border:1px solid #d9d2ea;border-radius:12px;background:#faf9fd;padding:12px 16px}
.g-ans h4{margin:0 0 8px;font-size:13.5px;color:#5b2fa6;letter-spacing:1px}
.g-ans pre.code{margin:4px 0}
.g-lock-tip{margin-top:12px;font-size:13px;color:var(--ink-2);background:#f6f4fa;border:1px dashed #d9d2ea;border-radius:10px;padding:8px 14px}

/* ---------- 历史成绩档案 ---------- */
.pill-btn{cursor:pointer;font-family:inherit;color:#fff}
.pill-btn:hover{background:rgba(255,255,255,.32)}
.modal-mask{position:fixed;inset:0;background:rgba(20,28,40,.45);display:none;align-items:flex-start;justify-content:center;z-index:99;padding:30px 14px}
.modal-mask.show{display:flex}
.modal{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);z-index:1}
.modal-head h3{margin:0;font-size:16.5px}
.modal-close{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;cursor:pointer;min-height:38px;color:var(--ink-2)}
.modal-close:hover{border-color:#9db3d8;color:var(--brand)}
.modal-body{padding:18px 22px 24px}
.hist-overview{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.hist-card{flex:1;min-width:150px;background:#f6f8fb;border:1px solid var(--line);border-radius:12px;padding:12px 16px;text-align:center}
.hist-card b{display:block;font-size:22px;color:var(--brand-deep)}
.hist-card span{font-size:12.5px;color:var(--ink-2)}
.hist-sec{font-size:13px;letter-spacing:1.5px;color:var(--ink-2);margin:18px 0 8px;font-weight:700}
table.hist-tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.hist-tbl th,.hist-tbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left}
.hist-tbl th{color:var(--ink-2);font-weight:600;background:#fafbfc}
.hist-bar{height:8px;background:#e8edf3;border-radius:999px;overflow:hidden;min-width:90px}
.hist-bar>i{display:block;height:100%;background:var(--ok);border-radius:999px}
.hist-log{font-size:13px}
.hist-log .row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px dashed var(--line)}
.hist-log .t{color:#98a5b3;font-family:var(--mono);font-size:12px;flex:0 0 118px}
.hist-log .k{font-family:var(--mono);flex:0 0 92px;word-break:break-all}
.hist-log .chp{color:var(--ink-2);flex:0 0 52px}
.hist-log .mark{font-weight:700}
.hist-empty{color:#98a5b3;padding:14px 0;text-align:center}

/* ---------- 选择题选项 ---------- */
.opts{display:flex;flex-direction:column;gap:10px;margin:12px 0 4px}
.opt{
  display:flex;align-items:flex-start;gap:12px;
  border:1.5px solid var(--line);border-radius:11px;background:#fff;
  padding:10px 16px;cursor:pointer;min-height:48px;
  font-size:15.5px;transition:border-color .15s,background .15s;
}
.opt:hover{border-color:#9db3d8;background:#f8fafd}
.opt .key{
  flex:0 0 26px;height:26px;border-radius:50%;background:#eef1f5;color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;margin-top:2px;
}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .key{background:var(--brand);color:#fff}
.opt.reveal-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.reveal-ok .key{background:var(--ok);color:#fff}
.opt.reveal-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.reveal-bad .key{background:var(--bad);color:#fff}
.opt .opt-body{flex:1;min-width:0;word-break:break-word}
.opt .opt-body code{font-family:var(--mono);font-size:14px;background:rgba(61,111,224,.08);border-radius:4px;padding:0 5px}

/* ---------- 提交按钮（≥44px 触控区） ---------- */
.actions{margin-top:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{
  min-height:46px;padding:10px 30px;border-radius:11px;border:0;cursor:pointer;
  font-size:15.5px;font-weight:600;letter-spacing:1px;
}
.btn.primary{background:var(--brand);color:#fff;box-shadow:0 3px 10px rgba(61,111,224,.28)}
.btn.primary:hover{background:var(--brand-deep)}
.btn:disabled{background:#b9c3cf;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink-2);min-height:44px}
.btn.ghost:hover{border-color:#9db3d8;color:var(--brand)}

/* ---------- 判卷反馈横幅 ---------- */
.verdict{
  margin-top:14px;border-radius:11px;padding:12px 18px;font-size:15px;font-weight:600;
  display:none;align-items:center;gap:10px;
}
.verdict.show{display:flex}
.verdict.ok{background:var(--ok-soft);color:#12683e;border:1px solid #bfe6cd}
.verdict.bad{background:var(--bad-soft);color:#8f1f1f;border:1px solid #f2c7c7}

/* ---------- 解析面板 ---------- */
.explain{
  margin-top:14px;border-radius:12px;border:1px solid var(--line);
  background:#fbfcfe;padding:16px 20px;font-size:14.5px;display:none;
}
.explain.show{display:block}
.explain h4{margin:0 0 10px;font-size:14px;letter-spacing:2px;color:var(--ink-2)}
.explain .row{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.explain .row>b{flex:0 0 64px;font-size:13px;color:#fff;border-radius:6px;text-align:center;padding:2px 0;margin-top:3px;font-weight:600}
.explain .row.ans>b{background:var(--brand)}
.explain .row.idea>b{background:var(--gold)}
.explain .row.ref>b{background:#58a06a}
.explain .row.src>b{background:#8a6ad6}
.explain .row .val{flex:1;min-width:0}
.explain .val code{font-size:13.5px}

/* ---------- 章节切换 ---------- */
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.pager .btn{padding:10px 22px}

/* ---------- 大题拆解卡片 ---------- */
.group-card{border-left:5px solid #7a3fe0}
.g-title{font-size:17px;font-weight:700;margin:4px 0 8px;color:#5b2fa6}
.g-intro{font-size:15px;color:var(--ink);margin:0 0 4px;line-height:1.85}
.sub{border-top:1px dashed #d9d2ea;margin-top:16px;padding-top:14px;border-radius:10px}
.sub .q-top{margin-bottom:6px}
.sub.locked-ok{background:#f4fbf7;margin:16px -8px 0 -8px;padding:14px 8px 8px}
.sub.locked-bad{background:#fdf6f6;margin:16px -8px 0 -8px;padding:14px 8px 8px}
.lv-badge.g{background:#efe6fb;color:#7a3fe0}
.lv-group.g h3{color:#7a3fe0}

/* ---------- 章节成绩单 ---------- */
.score-strip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.score-chip{font-size:12.5px;background:#f2f4f8;border:1px solid var(--line);border-radius:8px;padding:3px 10px;color:var(--ink-2)}
.score-chip.big{background:var(--brand-soft);border-color:#c9d8f6;color:var(--brand-deep);font-size:13.5px;padding:5px 14px}
.score-chip.big b{font-size:16px}
.btn.mini{min-height:38px;font-size:13px;padding:6px 16px;border-radius:9px}

/* ---------- 空态 / 页脚 ---------- */
.empty{padding:60px 0;text-align:center;color:var(--ink-2)}
footer{
  max-width:1000px;margin:0 auto 40px;padding:0 16px;text-align:center;
  color:#9aa7b4;font-size:12.5px;line-height:1.9;
}

/* ============================================================
   移动端兜底：≤880px 折叠为单列，侧栏变顶部横向滑动章节条
   ============================================================ */
@media (max-width:880px){
  body{font-size:15.5px}
  .topbar{padding:20px 14px 18px}
  .topbar h1{font-size:19px}
  .layout{flex-direction:column;margin:14px auto 40px;padding:0 10px;gap:12px}
  .side{position:static;width:100%;flex:none;padding:8px}
  .side h3{display:none}
  .navwrap{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  .nav-item{flex:0 0 auto;width:auto;padding:6px 14px}
  .nav-item .dot{display:none}
  .side .reset{width:100%;margin:6px 0 2px}
  .qcard,.ch-head{padding:16px 14px;border-radius:12px}
  .stem{font-size:15.5px}
  .opt{font-size:15px;padding:10px 12px}
  pre.code{font-size:13px;padding:12px 10px}
  .btn{width:100%}
  .pager{flex-direction:column}
  .pager .btn{width:100%}
  .blank input{max-width:150px}
  .explain .row>b{flex:0 0 56px}
}
@media (max-width:380px){
  .blank input{min-width:90px;max-width:120px}
  .statline .pill{padding:3px 10px;font-size:12.5px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <h1>⌨️ C 语言刷题系统<span class="tag">第1–11章 · 全量覆盖</span></h1>
    <div class="sub">依据《程序设计基础》课件（清华大学软件学院）· 概述 → 数据类型 → 程序设计 → 循环 → 数组 → 函数 → 指针 → 结构体</div>
    <div class="statline">
      <span class="pill" id="stat-total">共 0 题</span>
      <span class="pill" id="stat-done">已做 0</span>
      <span class="pill" id="stat-ok">正确 0</span>
      <div class="pbar"><i id="stat-bar"></i></div>
      <span class="pill" id="stat-rate">正确率 —</span>
      <button class="pill pill-btn" id="btn-hist">📊 历史成绩</button>
    </div>
  </div>
</header>

<div class="layout">
  <aside class="side">
    <h3>章节导航</h3>
    <div class="navwrap" id="nav"></div>
    <button class="reset" id="btn-reset">🗑️ 重置全部做题记录</button>
  </aside>
  <main class="main" id="main"></main>
</div>

<footer>
  数据来源：本课程第 1–11 章 PDF 课件、课堂补充与例题 · Level 3 部分题目改编自洛谷入门题<br>
  纯前端单文件实现 · highlight.js 代码高亮（CDN 失联时自动降级） · 做题记录与历史成绩档案均保存在浏览器本地（重置不影响档案）
</footer>

<!-- 历史成绩档案弹窗 -->
<div class="modal-mask" id="hist-mask">
  <div class="modal">
    <div class="modal-head">
      <h3>📊 做题档案 · 历史成绩</h3>
      <button class="modal-close" id="btn-hist-close">✕ 关闭</button>
    </div>
    <div class="modal-body" id="hist-body"></div>
  </div>
</div>

<script>
/* ============================================================
 * 引擎：题库渲染 / 判卷 / 锁定 / 进度持久化
 * 题目对象格式：
 * { id, ch, level(1|2|3), type:'choice'|'fill',
 *   stem, code(可空), options(choice), answer(choice下标),
 *   blanks(fill):[{accept:[...]}], ansShow(展示答案),
 *   idea(思路), ref(课件页码), src(真题/来源) }
 * 填空题代码中用 __0__ __1__ … 标记空位
 * ============================================================ */
"use strict";

const STORE_KEY = "c_quiz_v1";
const LETTERS = ["A","B","C","D","E","F"];

/* ---------- 题库（分批追加数据，见文件底部标记） ---------- */
const questions = [];
/* ================= 第1章 概述与第一个程序（9题） ================= */

 code:`#include <stdio.h>
int main()
{
    int a, b, c, t;
    scanf("%d%d%d", &a, &b, &c);
    if (a > b) { t = a; a = b; b = t; }   /* 保证 a<=b */
    if (__0__) { t = b; b = c; c = t; }   /* 保证 b<=c，c 为最大 */
    if (__1__) { t = a; a = b; b = t; }   /* 再修一次 a<=b */
    printf("%d %d %d\\n", a, b, c);
    return 0;
}`,

{id:"g3a",ch:3,level:4,type:"group",
 gtitle:"【工程实践·大题】半角公式计算器（两层函数）",
 gintro:"【需求】输入角度 α，计算 y = √((1 − cos α)/2)。<br>【样例】输入 <code>30</code> → 输出 <code>y = 0.26</code>。<br>【要求】<b>拆两个函数</b>：deg2rad（角度→弧度，cos 只吃弧度）与 halfAngle（套半角公式），main 只管输入输出。数学函数来自标准库。",
 gcode:`#include <stdio.h>
#include <math.h>
#define PI 3.14159
double deg2rad(double deg)
{
    return deg / 180 * PI;
}
double halfAngle(double alpha)
{
    return sqrt((1 - cos(deg2rad(alpha))) / 2.0);
}
int main()
{
    double alpha, y;
    scanf("%lf", &alpha);
    y = halfAngle(alpha);
    printf("y = %.2f\\n", y);
    return 0;
}`,

{id:"g5b",ch:5,level:4,type:"group",

 gintro:"【需求】不断读入成绩（整数，输入 <code>-1</code> 结束），实时维护第一、第二、第三名，最后输出三者。<br>【样例】输入 <code>90 70 85 95 -1</code> → 输出 <code>95 90 85</code>。<br>【方法】三个变量 First/Second/Third 链式更新，一遍扫描 O(n)，不保存全部数据。",
 gcode:`#include <stdio.h>
int main()
{
    int First = -1, Second = -1, Third = -1, x;
    while (1)
    {
        scanf("%d", &x);
        if (x == -1) break;
        if (x > First)
        {
            Third = Second;
            Second = First;
            First = x;
        }
        else if (x > Second)
        {
            Third = Second;
            Second = x;
        }
        else if (x > Third)
            Third = x;
    }
    printf("%d %d %d\\n", First, Second, Third);
    return 0;
}`,

{id:"g6a",ch:6,level:4,type:"group",

 gintro:"【需求】输入一个字符串（长度 ≤ 100），重排为三段：<b>大于原首字符</b>的字符（保持原相对次序）｜原首字符｜<b>小于等于首字符</b>的字符（按 ASCII 升序）。<br>【样例】输入 <code>abcdABCD1234</code> → 输出 <code>bcda1234ABCD</code>（b c d 大于 a；右侧 1 2 3 4 A B C D 升序）。<br>【要求】排序逻辑<b>独立成 sort 函数</b>（冒泡），main 负责分区与组装。",
 gcode:`#include <stdio.h>
#include <string.h>
void sort(char a[], int n)
{
    int i, j;  char temp;
    for (j = 0; j < n - 1; j++)
        for (i = n - 1; i >= j + 1; i--)
            if (a[i] < a[i - 1])
            { temp = a[i]; a[i] = a[i-1]; a[i-1] = temp; }
}
int main()
{
    char str[101], strLarge[101] = {0}, strSmall[101] = {0};
    int i, j, k, n;
    gets(str);
    n = strlen(str);
    j = k = 0;
    for (i = 1; i < n; i++)
    {
        if (str[i] > str[0]) strLarge[j++] = str[i];
        else strSmall[k++] = str[i];
    }
    strLarge[j] = str[0];
    sort(strSmall, k);
    strcpy(str, strLarge);
    strcat(str, strSmall);
    puts(str);
    return 0;
}`,

 gcode:`#include <stdio.h>
#include <string.h>
int CompareVersion(char v1[], char v2[])   /* v1 > v2 返回 1 */
{
    int len1 = strlen(v1), len2 = strlen(v2);
    int i = 0, j = 0;
    while (i < len1 || j < len2)
    {
        int sum1 = 0, sum2 = 0;
        while (i < len1 && v1[i] != '.') {
            sum1 = sum1 * 10 + v1[i] - '0';
            i++;
        }
        while (j < len2 && v2[j] != '.') {
            sum2 = sum2 * 10 + v2[j] - '0';
            j++;
        }
        if (sum1 > sum2) return 1;
        else if (sum1 < sum2) return 0;
        i++; j++;    /* 跳过 '.' */
    }
    return 0;
}`,

int myAtoi(char s[])
{
    int i = 0, value = 0, sign = 1;
    while (s[i] == ' ') i++;
    if (s[i] == '-') { sign = -1; i++; }
    while (s[i] >= '0' && s[i] <= '9') {

}

{id:"g11b",ch:11,level:4,type:"group",
 gtitle:"【课件综合·大题】明天的日期（三层函数设计）",
 gintro:"【需求】输入今天的日期（月 日 年），输出明天的日期。<br>【样例】<code>2 28 2008</code> → <code>2/29/2008</code>（闰年）；<code>12 31 2024</code> → <code>1/1/2025</code>（跨年）。<br>【要求】<b>三层模块化</b>：isLeapYear（闰年）→ numberOfDays（当月天数，查表 + 二月特判）→ dateUpdate（三分支推演，接收/返回结构体）。",
 gcode:`#include <stdio.h>
struct date { int month, day, year; };
int isLeapYear(struct date d)
{
    return (d.year % 4 == 0 && d.year % 100 != 0) || d.year % 400 == 0;
}
int numberOfDays(struct date d)
{
    int daysPerMonth[12] = {31,28,31,30,31,30,31,31,30,31,30,31};
    if (d.month == 2 && isLeapYear(d)) return 29;
    return daysPerMonth[d.month - 1];
}
struct date dateUpdate(struct date today)
{
    struct date tomorrow;
    if (today.day != numberOfDays(today))
    {
        tomorrow.day = today.day + 1;
        tomorrow.month = today.month;
        tomorrow.year = today.year;
    }
    else if (today.month == 12)
    {
        tomorrow.day = 1;
        tomorrow.month = 1;
        tomorrow.year = today.year + 1;
    }
    else
    {
        tomorrow.day = 1;
        tomorrow.month = today.month + 1;
        tomorrow.year = today.year;
    }
    return tomorrow;
}
int main()
{
    struct date today, tmr;
    scanf("%d %d %d", &today.month, &today.day, &today.year);
    tmr = dateUpdate(today);
    printf("%d/%d/%d\\n", tmr.month, tmr.day, tmr.year);
    return 0;
}`,

 stem:"<code>=</code> 与 <code>==</code>，一个符号之差，语义完全不同。正确的说法是？",
 options:["= 是比较，== 是赋值","<b>= 是赋值</b>（把右边算好存进左边变量，整个表达式的值 = 存进去的值）；<b>== 是比较</b>（判断相等，表达式的值为 1 或 0）","两者在 if 里可以互换","== 是 C++ 的写法，C 里只能用 ="],
 answer:1,
 ansShow:"B",
 idea:"if (status = 1) 先把 1 存进 status，表达式的值是 1（真）——分支永远执行，这就是「世上最后一个 C Bug」。防坑心法：常数写左边（if (1 == status) 漏一个 = 会编译错）。",
 ref:"第3章课件 p52（= vs ==）",
 src:"基础辨析（运算符对辨析）"},
{id:"q3-21",ch:3,level:0,type:"choice",
 stem:"表达式 <code>1 + 2 * 3 &gt; 5 &amp;&amp; 2 != 3</code> 的求值顺序，依据是？",
 options:["从左到右依次算，没有优先级","按优先级分组：<b>算术（*）→ 算术（+）→ 关系（&gt;、!=）→ 逻辑（&amp;&amp;）</b>；同级看结合性（多为从左到右）——拿不准就加括号","关系运算优先级高于乘法","&& 优先级最高"],
 answer:1,
 ansShow:"B",
 idea:"优先级大表（课件 p39）：! &gt; 算术 &gt; 关系 &gt; &amp;&amp; &gt; || &gt; 赋值。所以上式 = ((1+2*3) &gt; 5) &amp;&amp; (2 != 3) = (7&gt;5) &amp;&amp; 1 = 1。课件建议：宁多括号，不赌优先级。",
 ref:"第3章课件 p39（优先级与结合性）",
 src:"基础辨析（优先级工作逻辑）"},
{id:"q3-22",ch:3,level:0,type:"choice",
 stem:"switch 语句里，<code>case</code> 标签和 <code>break</code> 各自扮演什么角色？",
 options:["case 是出口、break 是入口","case 只标<b>入口</b>（匹配后从这里开始执行）；break 才是<b>出口</b>（跳出 switch）——没有 break 就会一路「落穿」执行后面的 case","case 会自动跳出","break 之后还能回来执行 default"],
 answer:1,
 ansShow:"B",
 idea:"switch = 「带标签的跳转」：从匹配处顺序执行到 break/末尾。利用「落穿」可以多标一处理（case 1: case 2: 共用代码），但失手漏写就是 bug（q3-4 专门考过）。",
 ref:"第3章课件 p55–56（switch 与 break）",
 src:"基础辨析（语法元素工作逻辑）"},
{id:"q3-23",ch:3,level:0,type:"choice",
 stem:"<code>?:</code> 条件运算符的完整工作流程是？",
 options:["a ? b : c —— 先算 a：非 0 则整个表达式的值取 b（只算 b），为 0 则取 c（只算 c）；它是 C 唯一的<b>三目</b>运算符","三个操作数都会被计算","它是一种循环结构","不能嵌套在表达式里"],
 answer:0,
 ansShow:"A",
 idea:"?: 是「压缩版 if-else」，但它是<b>表达式</b>（有值），可以出现在赋值右边、printf 参数里：max = a&gt;b ? a : b。短路语义：只算选中的那一路。",

 src:"基础辨析（运算符工作逻辑）"},

{id:"q4-19",ch:4,level:0,type:"choice",
 stem:"<code>for (表达式1; 表达式2; 表达式3)</code> 三个部分的<b>执行时机</b>，正确的是？",
 options:["三个部分每轮都执行","表达式1 只在<b>循环开始前执行一次</b>（初始化）；表达式2 是<b>每轮进入循环体之前</b>判断的条件；表达式3 是<b>每轮循环体结束后</b>执行的更新（步进）","表达式2 在循环体之后判断","表达式3 在循环开始前执行"],
 answer:1,
 ansShow:"B",
 idea:"执行序：①表达式1 → ②表达式2（假则退出）→ ③循环体 → ④表达式3 → 回到②。据此能推演出「多写分号」「漏更新死循环」「浮点步进误差」等所有 for 类 bug。",
 ref:"第4章课件 p8–9（for 语句一般形式）",
 src:"基础辨析（for 工作逻辑）"},
{id:"q4-20",ch:4,level:0,type:"choice",
 stem:"for、while、do-while 三者的关系，准确的是？",
 options:["三种毫无关系的语法","本质都是「条件循环」，可互相改写；差别在「判断时机」：for/while 先判后做（可能一次不执行），do-while <b>先做后判（至少执行一次）</b>；for 把「初始化/条件/更新」集中写在一行，计数场景最顺手","do-while 效率最高","while 不能写死循环"],
 answer:1,
 ansShow:"B",
 idea:"选型口诀：次数已知用 for；条件驱动（读到哨兵为止）用 while；「先干一次再说」（菜单、输入校验）用 do-while。注意 do-while 的 while(条件) 后有分号。",
 ref:"第4章课件 p41–43（三种循环语句比较）",
 src:"基础辨析（循环结构对辨析）"},
{id:"q4-21",ch:4,level:0,type:"choice",
 stem:"<code>break</code> 与 <code>continue</code> 对循环的影响，正确的是？",
 options:["都终止整个循环","<b>break 跳出整层循环</b>（提前结束）；<b>continue 只结束本轮</b>（跳过本轮剩余语句，回到条件判断继续下一轮）","continue 跳出所有循环","break 只能用于 switch"],
 answer:1,
 ansShow:"B",
 idea:"记忆：break = 「我不干了」，continue = 「这轮不算，下轮再来」。嵌套循环中两者都只作用于<b>最近一层</b>循环（q4-3 的经典演算）。",
 ref:"第4章课件 p45–55（break 与 continue）",
 src:"基础辨析（关键字对辨析）"},
{id:"q4-22",ch:4,level:0,type:"choice",
 stem:"写循环时的「三要素」是？漏掉「更新」环节会发生什么？",
 options:["初始化、条件、更新（步进）；漏了更新，条件永远成立，<b>死循环</b>——课件 p13 的实验：在循环体内给 n=n+1 反而绕过了预期步进，也是同类事故","定义、赋值、输出；漏了输出会死循环","输入、处理、输出；没有影响","三要素可有可无"],
 answer:0,
 ansShow:"A",
 idea:"任何循环都要回答三个问题：从哪开始（初始化）、何时停（条件）、怎么走（更新）。写循环前先默念一遍，90% 的循环 bug 无处遁形。",
 ref:"第4章课件 p12–13（死循环分析）",
 src:"基础辨析（循环三要素）"},
{id:"q4-23",ch:4,level:0,type:"choice",
 stem:"<code>/</code> 和 <code>%</code> 这对搭档在整数运算中的分工是？",
 options:["都是除法，结果一样","<b>/ 求商</b>（整数相除向零截断，5/2=2）、<b>% 求余数</b>（5%2=1，要求两侧都是整型）——数位拆分（n%10 取个位、n/10 去个位）全靠它们","% 求百分比","/ 可以用于字符串"],
 answer:1,
 ansShow:"B",
 idea:"商与余数的配合是「拆数」的万能工具：进制转换（n%k、n/k）、时间拆分（n/3600、n%60）、数字反转……注意 % 不能用于浮点（编译错）。",
 ref:"第2章课件 p38（算术运算符）；第4章课件 p33（数位拆分）",
 src:"基础辨析（运算符对辨析）"},

{id:"q5-19",ch:5,level:0,type:"choice",
 stem:"定义 <code>int a[5];</code> 时，计算机做了什么？「数组」的本质是什么？",
 options:["创建 5 个独立变量，名字分别是 a1~a5","在内存中划出 <b>5×4=20 字节的连续空间</b>，名字 a 绑定这段空间的<b>首地址</b>；数组 = 同类型元素的连续集合，「a + 下标」就是第 i 个元素","把 5 个数存进 a 里","数组占用的内存不连续，由系统随机分配"],
 answer:1,
 ansShow:"B",
 idea:"「连续」是数组的核心承诺：有了它，a[i] 的地址 = 首地址 + i×4，O(1) 随机访问。这也是下标从 0 开始的原因——a[i] 的 i 本质是「偏移量」。",
 ref:"第5章课件 p6–11（数组概念与定义）",
 src:"基础辨析（数组工作逻辑）"},
{id:"q5-20",ch:5,level:0,type:"choice",
 stem:"<code>a[i]</code> 这个写法的完整含义是？",
 options:["调用函数 a，参数是 i","以数组首地址为起点、<b>偏移 i 个元素</b>（跨 i×sizeof(int) 字节）得到的那个存储单元——先算地址、再访问","把 i 存进 a","数组 a 的第 i 个字节的编号"],
 answer:1,
 ansShow:"B",
 idea:"a[i] 被编译器翻译成 *(a+i)。理解了「下标 = 偏移」，就理解了：为什么下标从 0 开始（第一个元素偏移 0）、为什么越界不报错（地址照样算，只是出了自家地盘）、为什么后面指针能无缝接管数组。",
 ref:"第5章课件 p9–11（数组元素访问）",
 src:"基础辨析（下标工作逻辑）"},
{id:"q5-21",ch:5,level:0,type:"choice",
 stem:"「初始化」和「赋值」在数组身上为什么待遇不同？",
 options:["没有区别","<b>定义时</b>可以用 int a[5]={1,2,3}; 整体初始化（缺的补 0）；<b>定义后</b> a = {1,2,3}; 或 a = b; 都是<b>非法</b>的——数组名是常量地址，不能整体赋值，只能逐个 a[i]=…","赋值也可以整体，编译器优化了","初始化只能全 0"],
 answer:1,
 ansShow:"B",
 idea:"初始化是「出生时填写户口」，语法上开绿灯；赋值是「后天改名」，对数组关闸。要复制数组得循环逐元素，或 memcpy / strcpy（字符数组）。",
 ref:"第5章课件 p13（初始化）与 p15（常见错误：整体赋值）",
 src:"基础辨析（初始化 vs 赋值）"},
{id:"q5-22",ch:5,level:0,type:"choice",
 stem:"<code>a</code>、<code>a[0]</code>、<code>&amp;a[0]</code> 三者分别是什么？",
 options:["三个不同的变量","a 是<b>数组首地址</b>（常量，代表整个数组的起点）；a[0] 是<b>第一个元素的值</b>；&amp;a[0] 是<b>第一个元素的地址</b>（值上等于 a，但类型是「指向元素的指针」）","a 是第一个元素，a[0] 是地址，&amp;a[0] 是值","三者完全等价"],
 answer:1,
 ansShow:"B",
 idea:"分清「地址 / 值 / 变量」三兄弟是数组→指针过渡的关键。a 用在表达式中会「退化」为首元素地址，但它本身是常量——a++ 非法（第 10 章的 q10-3 专门辨析）。",
 ref:"第5章课件 p8–11；第10章课件 p57",
 src:"基础辨析（数组名三兄弟）"},
{id:"q5-23",ch:5,level:0,type:"choice",
 stem:"数组长度 5、下标写到了 5（a[5]=1;），程序既不编译报错、也常常能跑——这说明？",
 options:["a[5] 是合法的最后一个元素","C 编译器<b>不检查下标范围</b>（性能取舍）：a[5] 的地址照常计算（越界），写进去的是别人家的内存——后果是「随机破坏」（课件实验：变量 c 被改 0）","越界访问会自动返回 0","只有读越界危险，写越界安全"],
 answer:1,
 ansShow:"B",
 idea:"合法下标 0~n−1 是<b>程序员的契约</b>，不是编译器的职责。守界三件套：循环写 i&lt;n、长度用 sizeof 计算、容量用 #define 管理。",
 ref:"第5章课件 p10–11、p22–25（越界不检查）",
 src:"基础辨析（越界语义）"},

{id:"q6-19",ch:6,level:0,type:"choice",
 stem:"「字符串」在 C 中到底是什么？'\\0' 是谁、什么时候放进去的？",
 options:["一种独立的基本类型 string","约定俗成：<b>字符数组 + '\\0' 结尾</b>才算字符串。双引号初始化（char s[]=\"hi\"）时编译器自动补 '\\0'；手工逐字符搬运时<b>必须自己补</b>","'\\0' 是编译器任何时候都会自动补的","字符串就是 char 类型"],
 answer:1,
 ansShow:"B",
 idea:"C 没有 string 类型，字符串 = 「以 0 号字符结尾的字符数组」。strlen、printf 的 %s 都靠 '\\0' 找尾——忘了补，它们就会一直读下去（乱码）。",
 ref:"第6章课件 p4–5；第5章课件 p54–57",
 src:"基础辨析（字符串工作逻辑）"},
{id:"q6-20",ch:6,level:0,type:"choice",
 stem:"<code>'a'</code> 与 <code>\"a\"</code>，一字之差（引号形状），区别是？",
 options:["完全相同","'a' 是<b>字符常量</b>（单引号，占 1 字节，值 97，类型 char/int）；\"a\" 是<b>字符串常量</b>（双引号，占 2 字节：'a' + '\\0'，类型 char* 指向常量区）","单引号是 C++ 写法","双引号只能包中文"],
 answer:1,
 ansShow:"B",
 idea:"char c = \"a\"; 编译警告/错误——右边是指针，左边是字符。辨析口诀：<b>单引号一个字符、双引号一串字符（自带 '\\0'）</b>。",
 ref:"第5章课件 p57–58（字符数组初始化）；第2章课件 p34",
 src:"基础辨析（引号辨析）"},
{id:"q6-21",ch:6,level:0,type:"choice",
 stem:"<code>strlen(s)</code> 与 <code>sizeof(s)</code>（s 为 char s[20]=\"hello\"）的值分别是？为什么？",
 options:["都是 5","<b>5 和 20</b>：strlen 是运行时<b>数字符</b>（从头数到 '\\0' 之前，不含 '\\0'）；sizeof 是编译期<b>量地盘</b>（整个数组声明了多大）","20 和 5","6 和 20"],
 answer:1,
 ansShow:"5 和 20",
 idea:"一个量「内容长度」，一个量「容器容量」。陷阱：若 s 是 char *s=\"hello\"，sizeof(s) 变成 4（指针自身宽度）。另记：char b[]=\"Hello\" 的 sizeof 是 6（含 '\\0'）而 strlen 是 5。",
 ref:"第6章课件 p9；第5章课件 p13；第2章课件 p19",
 src:"基础辨析（strlen vs sizeof）"},
{id:"q6-22",ch:6,level:0,type:"choice",
 stem:"二维数组 <code>int a[3][4]</code> 在内存中怎么存放？a[i][j] 的地址怎么算？",
 options:["按列存放，一列挨一列","<b>按行存放</b>（行优先）：第 0 行 4 个元素接着第 1 行……共 12 个 int 连续；a[i][j] 的地址 = 起点 + (i×4 + j)×sizeof(int)——所以作函数参数时<b>第二维（列数）必须已知</b>","二维数组内存不连续","地址无法计算，靠系统查表"],
 answer:1,
 ansShow:"B",
 idea:"「数组的数组」+ 行优先存放，两个事实合起来推出了地址公式——列数是公式里的乘数，省了它地址就算不出来（q8-2 的伏笔在这里埋下）。",
 ref:"第5章课件 p39–44（二维数组与内存映像）",
 src:"基础辨析（二维数组工作逻辑）"},
{id:"q6-23",ch:6,level:0,type:"choice",
 stem:"strcmp / strcpy / strcat 三兄弟各自的工作逻辑是？",
 options:["都是比较字符串","<b>strcmp 逐字符比 ASCII</b>（到 '\\0' 或首对不同为止，返回 负/0/正）；<b>strcpy 逐字符拷贝</b>（连 '\\0' 一起，覆盖目标串）；<b>strcat 找到目标串的 '\\0' 从那里追加</b>（末尾补新的 '\\0'）","strcpy 是比较，strcmp 是拷贝","三者都返回新字符串"],
 answer:1,
 ansShow:"B",
 idea:"三个函数、三种遍历姿态：比较是「并行走」、拷贝是「边走边写」、追加是「先走到尾再写」。判断字符串相等必须 if (strcmp(a,b)==0)（== 比的是地址）。",
 ref:"第5章课件 p67–73（字符串函数）",
 src:"基础辨析（库函数工作逻辑）"}
);

{id:"q7-19",ch:7,level:0,type:"choice",
 stem:"解剖函数头 <code>int Add(int a, int b)</code>：三个「部件」各自规定了什么？",
 options:["int 是函数名，Add 是返回类型","<b>int = 返回值类型</b>（函数结束时交回一个整数）；<b>Add = 函数名</b>（调用的依据）；<b>(int a, int b) = 形参表</b>（声明两个「占位变量」等待接收传入的值）","三个都是变量名","int 是参数，Add 是类型"],

 idea:"函数头 = 「返回类型 + 名字 + 形参表」——它向编译器承诺：给我这些类型的输入，我还你一个 int。花括号里的函数体兑现承诺。读懂函数头，函数就没秘密了。",

{id:"q7-20",ch:7,level:0,type:"choice",
 stem:"「形参」与「实参」的本质区别是？",
 options:["同一个东西的两种写法","<b>形参</b>：定义处参数表里的「占位变量」（int a），调用时才分配内存、拿到副本；<b>实参</b>：调用处括号里的「真值」（Add(x, 3)），可以是常量/变量/表达式——值被复制给形参","形参是全局变量","实参必须是变量，不能是表达式"],

{id:"q7-21",ch:7,level:0,type:"choice",
 stem:"<code>return x;</code> 这句话在函数里做了两件事，是哪两件？",
 options:["打印 x；清空内存","<b>① 结束函数</b>（立刻返回调用处，后面的语句不再执行）；<b>② 把 x 的值带回调用点</b>（函数调用表达式整体的值就是 x）","定义 x；销毁 x","循环 x 次"],
 answer:1,
 ansShow:"B",
 idea:"「函数调用是一个会算值的表达式」——printf(power(2,10)) 里 power(2,10) 整体就是返回值。一个函数可以有多条 return（多分支各回各的），但每次执行只会走一条。",

 src:"基础辨析（return 工作逻辑）"},
{id:"q7-22",ch:7,level:0,type:"choice",
 stem:"「函数声明（原型）」与「函数定义」的区别是？",
 options:["完全等价","<b>声明</b>只报「签名」：int Add(int, int); ——带分号，告诉编译器有这么个函数（可重复多次）；<b>定义</b>给出完整实现：int Add(int a,int b){...} ——函数头无分号，全程序只能有一次","声明也要写函数体","定义必须在程序第一行"],
 answer:1,
 ansShow:"B",
 idea:"声明是「名片」，定义是「本人」。main 写在前面时，靠名片提前认识后面的函数。声明可省形参名（只写类型），定义不行（形参要用于函数体）。",
 ref:"第7章课件 p18–20（函数原型）",
 src:"基础辨析（声明 vs 定义）"},
{id:"q7-23",ch:7,level:0,type:"choice",
 stem:"<code>void</code> 这个关键字放在函数头（如 <code>void hello()</code>）表示什么？函数体内还能写 return 吗？",
 options:["函数不存在","<b>不返回任何值</b>——调用处不能拿它赋值；函数体内可以写单独的 <code>return;</code>（不带值）用于提前结束","表示函数是空的，不能有语句","表示参数为空"],
 answer:1,
 ansShow:"B",
 idea:"void = 「空」。对比记忆：int Add() 必须 return 整数；void hello() 可以裸 return; 提前退场，也可以不写（函数体跑完自然结束）。参数为空另有写法 void hello(void)。",
 ref:"第7章课件 p8、p17（无返回值函数与 return）",
 src:"基础辨析（void 语义）"},
/* ---- 第8章 ---- */
{id:"q8-19",ch:8,level:0,type:"choice",
 stem:"函数头里的返回类型（int / void / double / char*）约束了什么？",
 options:["只是注释，不影响任何行为","约束「函数交回来的值是什么类型」：调用处只能按这个类型使用结果（如 double Area() 的结果能参加浮点运算；void 的结果不能赋值）；return 的表达式也会被转换成该类型再交出","决定函数名能不能重名","决定参数个数"],
 answer:1,
 ansShow:"B",
 idea:"返回类型是「输出规格」。漏写返回类型的老式 C 默认 int——所以漏 include &lt;math.h&gt; 时 cos 被当 int 截断，惨案由此而来。类型即契约。",
 ref:"第7章课件 p16（返回类型）；第8章课件 p16（函数类型）",
 src:"基础辨析（返回类型语义）"},
{id:"q8-20",ch:8,level:0,type:"choice",
 stem:"<code>void f(int a[])</code> 与 <code>void g(int x)</code>：调用 f(arr) 与 g(n) 后，函数内部对参数的修改，效果为何不同？",
 options:["都一样","<b>g 的 x 是值传递</b>：改的是副本，n 不变；<b>f 的 a 接收的是数组首地址</b>：a[i]=… 直接写进原数组——「数组名作参数 = 地址传递」，这正是能用形参数组「多值返回」的原因","f 也是值传递，改了也白改","数组太大时会自动变成引用"],
 answer:1,
 ansShow:"B",
 idea:"数组名作实参传的是首地址（拷贝的也是地址，但顺着它就能摸到原数组）。swap2(a[0],a[1]) 与 swap2(a) 的对比实验（课件 p25–26）是这一规则的最佳演示。",
 ref:"第8章课件 p24–29（数组名作函数参数）",
 src:"基础辨析（传值 vs 传址）"},
{id:"q8-21",ch:8,level:0,type:"choice",
 stem:"<code>int a;</code> 的三种「户口」：函数内 auto / 函数内 static / 函数外（全局），三者各自的生存期是？",
 options:["都活到程序结束","auto：随函数调用<b>生灭</b>（进函数生、出函数亡）；static 局部与全局：<b>活到程序结束</b>（static 的初值只赋一次）——但 static 局部的<b>作用域</b>仍限于本函数","都随函数生灭","只有全局变量有生存期"],
 answer:1,
 ansShow:"B",
 idea:"「住多久」（生存期）与「在哪可见」（作用域）是两个独立维度：static 局部活得久但别人看不见；全局既活得久又大范围可见（还容易被乱改）。",
 ref:"第8章课件 p39–44（static）；第7章课件 p34–37（局部/全局）",
 src:"基础辨析（存储类别）"},
{id:"q8-22",ch:8,level:0,type:"choice",
 stem:"「作用域」与「生存期」这对概念，正确的辨析是？",
 options:["完全同义","<b>作用域 = 空间维度</b>：代码的哪些位置能「看见」这个名字（花括号范围）；<b>生存期 = 时间维度</b>：这个名字占的内存「活着」多久——static 局部变量是「作用域小、生存期长」的典型","作用域指时间，生存期指空间","两者都只对全局变量有意义"],
 answer:1,
 ansShow:"B",
 idea:"二维表格记忆：auto 局部 = 小空间短时间；static 局部 = 小空间长时间；全局 = 大空间长时间。编译错误「未定义标识符」多半是作用域越界，逻辑错误「值莫名丢失」多半是生存期到头。",
 ref:"第8章课件 p34–35、p41（属性分类）",
 src:"基础辨析（概念对辨析）"},
{id:"q8-23",ch:8,level:0,type:"choice",
 stem:"想让一次函数调用「带回」多个结果，可行的途径有哪些？",
 options:["C 语言做不到，必须用全局变量","① return 只能带回一个值；② 用<b>形参数组</b>往里写多个结果（地址传递）；③ 用<b>指针形参</b>逐个写回（第 9 章）；④ 打包成<b>结构体</b>整体返回（第 11 章）","只能定义多个同名函数","用 printf 直接输出就不算返回"],
 answer:1,
 ansShow:"B",
 idea:"「一次调用多个产出」的三条正路，分别在三章各演一遍：result[]（q8-15）、MinMax 指针版（q9-7）、dateUpdate 结构体返回（q11-8）。return 逗号表达式（return a,b）只回最后一个，是陷阱不是方案。",
 ref:"第8章课件 p28（多值返回）",
 src:"基础辨析（多值返回途径）"},
/* ---- 第9章 ---- */
{id:"q9-19",ch:9,level:0,type:"choice",
 stem:"解剖定义 <code>int *p;</code>：三个「单词」各自说了什么？",
 options:["定义了一个整数","<b>int = 基类型</b>（p 将来指向的对象是 int）；<b>* = 指针标记</b>（p 是「存地址的变量」）；<b>p = 指针变量名</b>（注意名字是 p 不是 *p）——合起来读作「p 是指向 int 的指针」","p 是 int 的别名","* 是乘号，p 是乘积"],
 answer:1,
 ansShow:"B",
 idea:"一句定义回答三个问题：p 自己存什么（地址）、顺着 p 能摸到什么（int 对象）、解引用一步走多远（4 字节）。int *a, b; 里 b 不是指针——* 只修饰紧跟的名字（q9-1 的坑）。",
 ref:"第9章课件 p14–15（指针定义形式）",
 src:"基础辨析（指针定义解剖）"},
{id:"q9-20",ch:9,level:0,type:"choice",
 stem:"<code>&amp;</code>（取地址运算符）的工作逻辑是？",
 options:["求两数按位与","<b>单目运算符</b>：贴在变量前面，返回「这个变量在内存里的地址」——scanf(\"%d\", &amp;n) 正是把 n 的地址交给 scanf，让它知道往哪儿写","求两数的逻辑与","取变量的值"],
 answer:1,
 ansShow:"B",
 idea:"每个变量都有住址。&amp;x 就是「查户口拿门牌号」。注意区分：&amp;&amp;（逻辑与）、&amp;（单目取地址 / 位与）——位置和操作数个数决定身份。",
 ref:"第9章课件 p17–19（& 运算符）",
 src:"基础辨析（& 工作逻辑）"},
{id:"q9-21",ch:9,level:0,type:"choice",
 stem:"<code>*</code> 出现在 <code>int *p;</code> 与出现在 <code>*p = 5;</code> 中，含义一样吗？",
 options:["完全一样","<b>不一样</b>：定义处 * 是「指针标记」（声明 p 能存地址）；表达式处 * 是<b>解引用运算符</b>（顺着 p 存的地址找到对象并访问）——同符号两副面孔","都是乘法","定义处的 * 可以省略"],
 answer:1,
 ansShow:"B",
 idea:"读法口诀：看到 int*/char* 开头 → 「声明指针」；看到单独 *p → 「顺着指针摸对象」。*p = 5 的意思是「把 5 写进 p 指向的那个变量」，前提是 p 已经指向有效内存（q9-4 的野指针教训）。",
 ref:"第9章课件 p14、p20–22（* 的两义）",
 src:"基础辨析（* 双重身份）"},
{id:"q9-22",ch:9,level:0,type:"choice",
 stem:"<code>NULL</code> 与「未初始化的指针」是一回事吗？",
 options:["是一回事","<b>不是</b>：NULL 是约定的「空指针值」（地址 0），合法、可比较、可判断（p == NULL / p != NULL）；未初始化指针里是<b>随机垃圾地址</b>（野指针），解引用等于随机读写内存","NULL 会让程序崩溃","未初始化指针自动等于 NULL"],
 answer:1,
 ansShow:"B",
 idea:"规范姿势：定义即初始化——暂时不用就 int *p = NULL;。NULL 是「明确的没有」，野指针是「不知道指向哪」。链表结尾、查找失败都用 NULL 表达「到此为止」。",
 ref:"第9章课件 p27–29、p33（NULL 与未初始化）",
 src:"基础辨析（NULL 辨析）"},
{id:"q9-23",ch:9,level:0,type:"choice",
 stem:"<code>double *pd;</code> 执行 <code>pd + 1</code>，地址实际移动多少字节？",
 options:["1 字节","<b>sizeof(基类型) = 8 字节</b>（double 的宽度）——指针加 1 的「1」以「一个元素」为单位：int* 走 4 字节、double* 走 8 字节、char* 走 1 字节","8 字节，因为所有指针都是 8 字节","移动的距离不确定"],
 answer:1,
 ansShow:"8 字节",
 idea:"指针运算按「元素个数」而不是「字节数」计数——基类型决定步长。这正是 p 遍历数组时 p++ 恰好走到下一个元素的原因（pd+1 跨过一整个 double）。",
 ref:"第9章课件 p34–35（指针算术）",
 src:"基础辨析（指针步长）"},
/* ---- 第10章 ---- */
{id:"q10-19",ch:10,level:0,type:"choice",
 stem:"<code>malloc(n * sizeof(int))</code> 的工作逻辑是？",
 options:["在栈上创建数组","向系统<b>申请堆上一块 n×4 字节的连续内存</b>，成功则返回首地址（void* 类型，需强制转换），<b>失败返回 NULL</b>；内容不初始化（随机值）——与栈数组的区别：大小运行时定、生命周期由 free 手工管理","自动把内存清零","在硬盘中分配空间"],
 answer:1,
 ansShow:"B",
 idea:"malloc 三部曲：申请（记住字节数公式 = 个数 × sizeof）、判空（if (p == NULL)）、用完 free。堆内存「不随函数结束消失」——这既是它比栈数组灵活之处，也是泄漏风险的来源。",
 ref:"第10章课件 p19–21（malloc 原型与用法）",
 src:"基础辨析（malloc 工作逻辑）"},
{id:"q10-20",ch:10,level:0,type:"choice",
 stem:"<code>free(p)</code> 执行后，p 本身会变成什么？接下来应该做什么？",
 options:["p 自动变成 NULL","p <b>仍是原来的地址</b>（悬空指针）——那块内存已归还系统，再解引用是未定义行为；规范做法是紧接着 p = NULL; 切断念想","p 被删除，不能再赋值","p 指向的内存被清零"],
 answer:1,
 ansShow:"B",
 idea:"free 只回收内存，不管指针变量自己。悬空指针与野指针一样危险；free(NULL) 是安全的空操作。三条铁律：free 原首地址、不重复 free、free 后置 NULL。",
 ref:"第10章课件 p26–30（free 与悬空指针）",
 src:"基础辨析（free 工作逻辑）"},
{id:"q10-21",ch:10,level:0,type:"choice",
 stem:"<code>int a[10];</code> 的 a 与 <code>int *p;</code> 的 p，关键区别是？",
 options:["没有区别","a 是<b>常量地址</b>（绑定后不能改：a++、a=p 都非法）；p 是<b>变量</b>（可自由改指：p=a、p++、p=&amp;x 都合法）——都能用 [i] 下标访问，但「能不能再指别处」是本质差异","a 是指针，p 是数组","两者都不能自增"],
 answer:1,
 ansShow:"B",
 idea:"「数组名 = 押在原地的常量指针，指针变量 = 可以乱跑的游标」。所以遍历数组两种写法等价：下标法 a[i]，或游标法 for(p=a; p&lt;a+10; p++)。",
 ref:"第10章课件 p57–59（数组名是常量指针）",
 src:"基础辨析（数组名 vs 指针）"},
{id:"q10-22",ch:10,level:0,type:"choice",
 stem:"<code>char a[] = \"hi\";</code> 与 <code>char *s = \"hi\";</code> 的内存差异是？",
 options:["完全相同的内存布局","<b>a：把 'h','i','\\0' 拷贝进自己的栈数组</b>（3 字节，内容可改：a[0]='H' ✓）；<b>s：只存常量区那份 \"hi\" 的地址</b>（指针自身 4 字节；改指向合法 s=\"bye\" ✓，改内容 s[0]='H' ✗ 未定义行为）","都在常量区","都在栈上"],
 answer:1,
 ansShow:"B",
  idea:"amessage/pmessage 对照（课件 p59）：数组是「复印件」（可涂改），字符串指针常指向「原件」（只读）。判断口诀：等号左边是数组 → 拷贝；左边是指针 → 引用。",
 ref:"第10章课件 p58–59（amessage 与 pmessage）",
 src:"基础辨析（两种字符串初始化）"},
{id:"q10-23",ch:10,level:0,type:"choice",
 stem:"读定义 <code>int *pa[4];</code>：由于 [] 优先级高于 *，正确的解读是？",
 options:["pa 是指向数组的指针","<b>pa 先与 [4] 结合 → pa 是数组</b>；元素类型 int* → <b> pa 是「含 4 个 int 指针的数组」</b>（指针数组）。要表达「指向数组的指针」得加括号：int (*p)[4]","pa 是二维数组","pa 是二级指针"],
 answer:1,
 ansShow:"B",
 idea:"读复杂声明像读算式：看优先级（[] () 高于 *）、从名字出发逐步结合。char *argv[]（main 第二参数）就是字符指针数组——每格存一个字符串的首地址。",
 ref:"第10章课件 p32（指针数组）",
 src:"基础辨析（声明读法）"},

{id:"q11-19",ch:11,level:0,type:"choice",
 stem:"<code>struct</code> 关键字的工作逻辑是？",
 options:["声明一个新变量","<b>把若干不同类型的成员「打包」成一个新的自定义类型</b>（一张图纸）：struct General { char Name[20]; int Power; ... }; 之后才能用它定义变量——打包解决的是「异构数据的聚合」","把几个变量合并成一个数","申请一块共享内存"],
 answer:1,
 ansShow:"B",
 idea:"数组解决「多个同类型」，结构体解决「一组不同类型」（姓名+年龄+分数）。图纸不占内存，按图纸盖房（定义变量）才分配——这是下一问的主题。",
 ref:"第11章课件 p7–10（结构体概念与定义）",
 src:"基础辨析（struct 工作逻辑）"},
{id:"q11-20",ch:11,level:0,type:"choice",
 stem:"访问结构体成员的 <code>.</code> 与 <code>-&gt;</code>，怎么选？",
 options:["随便用","<b>结构体变量用点</b>（LiuBei.Power）；<b>结构体指针用箭头</b>（px-&gt;Power）——箭头是「(*px).Power」的简写（先解引用再取成员，. 优先级高于 * 所以括号不能省）","指针也用点","箭头只能用于数组"],
 answer:1,
 ansShow:"B",
 idea:"等价三兄弟：x.name ⇔ (*px).name ⇔ px-&gt;name。箭头的「箭头指向谁就访问谁」的形象隐喻让它成为链表时代的头号运算符。",
 ref:"第11章课件 p23–24（三种访问方式）",
 src:"基础辨析（. 与 ->）"},
{id:"q11-21",ch:11,level:0,type:"choice",
 stem:"<code>struct date { int m, d, y; };</code> 与 <code>struct date today;</code>——哪一句分配了内存？",
 options:["两句都分配","<b>第一句是类型定义（画图纸）：不分配内存</b>；<b>第二句是变量定义（盖房子）：分配 12 字节</b>（3 个 int）——所以类型定义末尾的分号不能少，而定义变量时 struct 关键字不能省","只有第一句分配","都不分配"],
 answer:1,
 ansShow:"B",
 idea:"「图纸 vs 房子」：类型定义可以反复用（struct date a, b, c;），变量定义各自独立一份内存。整体赋值 today2 = today 合法（逐成员拷贝），整体比较/输入输出不行。",
 ref:"第11章课件 p10–11（类型与变量）",
 src:"基础辨析（类型 vs 变量）"},
{id:"q11-22",ch:11,level:0,type:"choice",
 stem:"<code>typedef struct date DATE;</code> 中 typedef 的工作是？",
 options:["定义了一个新类型","<b>给已有类型起别名</b>：之后 <code>DATE d;</code> 与 <code>struct date d;</code> 完全等价——没有创造新类型，只是省去处处写 struct 的麻烦；它在编译期处理（对比 #define 的预编译文本替换）","删除 struct 关键字","把结构体变成全局变量"],
 answer:1,
 ansShow:"B",
 idea:"typedef 的通用公式：「typedef 原类型 新名字」。别名与原类型完全同体——typeof 视角下毫无区别。它不分配内存、不能加初始化，是纯「命名服务」。",
 ref:"第11章课件 p34–36（typedef）",
 src:"基础辨析（typedef 工作逻辑）"},
{id:"q11-23",ch:11,level:0,type:"choice",
 stem:"<code>enum Color { RED, GREEN = 5, BLUE };</code> 中三个枚举常量的值是？",
 options:["0,1,2","<b>RED=0，GREEN=5（显式指定），BLUE=6（顺延 +1）</b>——枚举的本质是「给一组相关的整数常量起名字」，默认从 0 递增、可中途指定；枚举元素不加引号","1,5,7","RED, GREEN, BLUE 字符串"],
 answer:1,
 ansShow:"RED=0, GREEN=5, BLUE=6",
 idea:"枚举 = 「可读性更好的 #define 常量组」：switch 里 case september: 比 case 9: 自解释。注意给枚举变量赋整数要强转 day = (weekday)2;（课件 p38）。",
 ref:"第11章课件 p37–38（枚举默认值）",
 src:"基础辨析（enum 工作逻辑）"}
);

  {n:10, t:"第10章 指针2（字符串/动态内存）"},
  {n:11, t:"第11章 结构体"}
];
const LEVEL_META = {
  0:{name:"Level 0 · 基础夯实", cls:"lv0", desc:"最底层概念 · 语法元素的工作逻辑与易混点辨析"},
  1:{name:"Level 1 · 基础回忆", cls:"lv1", desc:"选择题 · 概念与易错点"},
  2:{name:"Level 2 · 模块代码填空", cls:"lv2", desc:"课件例题挖空 · 补全关键逻辑"},
  3:{name:"Level 3 · 算法拔高", cls:"lv3", desc:"真题/洛谷改编 · 算法与综合思路"},
  4:{name:"课件例题 · 大题拆解", cls:"g", desc:"完整例题/期末真题 · 拆为多个小问逐问判分"}
};

/* ---------- 持久化 ---------- */
let store = {ans:{}, log:[]};
try{
  const raw = localStorage.getItem(STORE_KEY);
  if(raw) store = JSON.parse(raw);
}catch(e){ store = {ans:{}, log:[]}; }
if(!store.ans) store.ans = {};
if(!Array.isArray(store.log)) store.log = [];   /* 历史成绩档案：重置不清除 */
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }

/* ---------- 工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const norm = s => String(s==null?"":s).replace(/\s+/g," ").trim();
function byChapter(n){ return questions.filter(q=>q.ch===n); }

function highlightC(code){
  try{
    if(window.hljs && hljs.getLanguage("c")){
      return hljs.highlight(code, {language:"c"}).value;
    }
  }catch(e){}
  return esc(code); /* CDN 不可用时降级 */
}

/* ---------- 判卷 ---------- */
function gradeFill(q, userArr){
  return q.blanks.map((b,i)=>{
    const u = norm(userArr[i]);
    if(u==="") return false;
    return b.accept.some(a=>norm(a)===u);
  });
}
function isAllCorrect(q, res){ return res.every(Boolean); }
/* 代码补写（code 型）的行级判分：引号外空格不敏感、引号内保留 */
function stripOutsideQuotes(s){
  let out = "", q = null;
  for (let i = 0; i < s.length; i++){
    const ch = s[i];
    if (q){
      out += ch;
      if (ch === "\\") out += s[++i] || "";
      else if (ch === q) q = null;
    } else if (ch === '"' || ch === "'"){
      q = ch; out += ch;
    } else if (ch !== " " && ch !== "\t"){
      out += ch;
    }
  }
  return out;
}
function lineEq(a, u){
  const na = norm(a), nu = norm(u);
  if(na === nu) return true;
  return stripOutsideQuotes(na) === stripOutsideQuotes(nu);
}
function gradeCode(q, arr){
  return q.lines.map((ln,i)=> typeof ln==="string" ? true
    : (norm(arr[i])!=="" && ln.accept.some(a=>lineEq(a, arr[i]))));
}

/* ---------- 题目索引：key -> 题对象（大题小问也纳入） ---------- */
const INDEX = {};
questions.forEach(q=>{
  if(q.type==="group") q.subs.forEach(s=>{ INDEX[s.sid] = {q:s, grp:q}; });
  else INDEX[q.id] = {q};
});
function expandCh(n){          /* 该章所有「计分小题」 */
  const arr=[];
  for(const q of questions){
    if(q.ch!==n) continue;
    if(q.type==="group"){
      for(const s of q.subs) arr.push({key:s.sid, level:4, grp:q});
    }else arr.push({key:q.id, level:q.level, grp:null});
  }
  return arr;
}
function expandAll(){ let a=[]; for(let c=1;c<=12;c++) a=a.concat(expandCh(c)); return a; }

/* ---------- 渲染：单题（或大题内的小问） ---------- */
function renderSingle(q, key, no, inGroup){
  const rec = store.ans[key];
  const locked = !!rec;
  const lv = LEVEL_META[q.level||2];

  let html = inGroup
    ? `<div class="sub ${locked ? (rec.ok?"locked-ok":"locked-bad") : ""}" id="card-${key}">`
    : `<section class="qcard ${locked ? (rec.ok?"locked-ok":"locked-bad") : ""}" id="card-${key}">`;
  html += `<div class="q-top">
    ${inGroup?`<span class="q-no">(${no})</span>`:`<span class="q-no">${String(no+1).padStart(2,"0")}</span><span class="lv-badge ${lv.cls}">Lv${q.level}</span>`}
    <span class="q-type">${q.type==="choice"?"单选":(q.type==="code"?"补写代码":"填空")}</span>
    ${locked?`<span class="q-state ${rec.ok?"ok":"bad"}">${rec.ok?"✅ 正确":"❌ 错误"}</span>`:""}
  </div>`;
  html += `<div class="stem">${q.stem}</div>`;

  if(q.type==="code"){
    /* 多行代码补写：固定行高亮显示，空行处放 textarea */
    const parts = []; let buf = [];
    const flush = ()=>{ if(buf.length){ parts.push(highlightC(buf.join("\n"))); buf=[]; } };
    q.lines.forEach((ln,i)=>{
      if(typeof ln === "string"){ buf.push(ln); }
      else{
        flush();
        const val = locked ? esc((rec.user||[])[i]||"") : "";
        const cls = locked ? ((rec.res||[])[i] ? "ok" : "bad") : "";
        const ph = ln.hint ? ` placeholder="${esc(ln.hint)}（补写此行）"` : "";
        const rows = ln.r || 2;
        parts.push(`<span class="cline ${cls}"><textarea data-q="${key}" data-l="${i}" rows="${rows}"${ph} autocomplete="off" spellcheck="false"${locked?" readonly":""}>${val}</textarea></span>`);
      }
    });
    flush();
    html += `<pre class="code"><code class="language-c">${parts.join("\n")}</code></pre>`;
  }

  if(q.code){
    let codeHtml = highlightC(q.code);
    if(q.type==="fill"){
      q.blanks.forEach((b,i)=>{
        const w = Math.min(Math.max((b.accept[0]||"").length*9+34, 110), 280);
        const val = locked ? esc(rec.user[i]||"") : "";
        const cls = locked ? (rec.res[i] ? "ok" : "bad") : "";
        codeHtml = codeHtml.split("__"+i+"__").join(
          `<span class="blank"><span class="bno">${i+1}</span><input data-q="${key}" data-b="${i}" style="width:${w}px" value="${val}" class="${cls}" autocomplete="off" spellcheck="false"></span>`
        );
      });
    }
    html += `<pre class="code"><code class="language-c">${codeHtml}</code></pre>`;
  }

  if(q.type==="choice"){
    html += `<div class="opts" data-q="${key}">`;
    q.options.forEach((op,i)=>{
      let cls = "";
      if(locked){
        if(i===q.answer) cls = "reveal-ok";
        else if(i===rec.user) cls = "reveal-bad";
      }
      html += `<label class="opt ${cls}" data-i="${i}">
        <input type="radio" name="o-${key}" value="${i}" ${locked?"disabled":""} ${locked&&rec.user===i?"checked":""}>
        <span class="key">${LETTERS[i]}</span><span class="opt-body">${op}</span></label>`;
    });
    html += `</div>`;
  }

  html += `<div class="actions">`;
  if(!locked){
    html += `<button class="btn primary ${inGroup?"mini":""}" data-act="submit" data-q="${key}">提交本问</button>`;
    if(q.type!=="choice") html += `<span style="font-size:13px;color:var(--ink-2)">按规范化匹配判分（空格不影响；引号内除外）</span>`;
  }
  html += `</div>`;

  html += `<div class="verdict" id="vd-${key}"></div>`;
  if(locked){
    const ref = q.ref || (inGroup && arguments[4] ? arguments[4].ref : q.ref);
    const src = q.src || (inGroup && arguments[4] ? arguments[4].src : q.src);
    html += `<div class="explain show">
      <h4>📖 解析</h4>
      <div class="row ans"><b>答案</b><div class="val">${q.ansShow || (q.type==="choice"?(q.options[q.answer]||""):"")}</div></div>
      <div class="row idea"><b>思路</b><div class="val">${q.idea}</div></div>
      <div class="row ref"><b>课件</b><div class="val">${ref||""}</div></div>
      <div class="row src"><b>来源</b><div class="val">${src||""}</div></div>
    </div>`;
  }
  html += inGroup ? `</div>` : `</section>`;
  return html;
}

/* ---------- 渲染：大题卡片（题面 + 完整代码 + 小问列表） ---------- */
function renderGroupCard(g){
  const subs = g.subs;
  const done = subs.filter(s=>store.ans[s.sid]).length;
  const ok = subs.filter(s=>store.ans[s.sid]&&store.ans[s.sid].ok).length;
  let html = `<section class="qcard group-card" id="card-${g.id}">
    <div class="q-top">
      <span class="q-no">大题</span>
      <span class="lv-badge g">例题拆解</span>
      <span class="q-type">${subs.length} 小问 · 逐问独立判分</span>
      ${done===subs.length
        ? `<span class="q-state ${ok===subs.length?"ok":"bad"}">${ok===subs.length?"✅ 全部正确":"❌ 完成 "+ok+"/"+subs.length}</span>`
        : (done?`<span class="q-state">⏳ 已做 ${done}/${subs.length}</span>`:"")}
    </div>
    <div class="g-title">${g.gtitle}</div>
    <div class="g-intro">${g.gintro}</div>`;
  subs.forEach((s,i)=>{ html += renderSingle(s, s.sid, i+1, true, g); });
  if(g.gcode){
    if(done===subs.length){
      html += `<div class="g-ans"><h4>📜 参考实现（全部小问已提交，对照学习）</h4><pre class="code"><code class="language-c">${highlightC(g.gcode)}</code></pre></div>`;
    }else{
      html += `<div class="g-lock-tip">🔒 提交上方全部 ${subs.length} 小问后，这里将展开课件的参考实现代码</div>`;
    }
  }
  html += `</section>`;
  return html;
}

/* ---------- 渲染：章节（每章一张独立试卷） ---------- */
let curCh = 1, curFilter = "all";
function matchFilter(keys){
  if(curFilter==="all")  return true;
  const ans = keys.map(k=>store.ans[k]);
  if(curFilter==="todo") return ans.some(a=>!a);
  if(curFilter==="ok")   return ans.length>0 && ans.every(a=>a&&a.ok);
  if(curFilter==="bad")  return ans.some(a=>a&&!a.ok);
  return true;
}
function renderChapter(){
  const main = $("#main");
  const meta = CHAPTERS.find(c=>c.n===curCh);
  const items = expandCh(curCh);
  const total = items.length;
  const done = items.filter(i=>store.ans[i.key]).length;
  const okc  = items.filter(i=>store.ans[i.key]&&store.ans[i.key].ok).length;
  const rate = done? Math.round(okc/done*100) : 0;
  const grade = !done ? "未开始"
    : okc/total>=0.9 ? "🌟 优秀"
    : okc/total>=0.7 ? "👍 良好"
    : okc/total>=0.6 ? "✏️ 及格" : "💪 再刷一遍";
  const seg = l => { const s = items.filter(i=>i.level===l);
    return `${s.filter(i=>store.ans[i.key]&&store.ans[i.key].ok).length}/${s.length}`; };

  let html = `<div class="ch-head">
    <h2>${meta.t}<span class="lv-tag">第 ${curCh} 章试卷 · 满分 ${total} 分</span></h2>
    <div class="score-strip">
      <span class="score-chip big">得分 <b>${okc}</b>/${total}（${rate}%）· ${grade}</span>
      <span class="score-chip">⬜ Lv0 ${seg(0)}</span>
      <span class="score-chip">🟦 Lv1 ${seg(1)}</span>
      <span class="score-chip">🟨 Lv2 ${seg(2)}</span>
      <span class="score-chip">🟪 Lv3 ${seg(3)}</span>
      <span class="score-chip">📖 大题 ${seg(4)}</span>
      <button class="btn ghost mini" data-act="reset-ch">↺ 重置本章</button>
    </div>
    <div class="filterbar">
      <button class="fbtn ${curFilter==="all"?"active":""}" data-f="all">全部</button>
      <button class="fbtn ${curFilter==="todo"?"active":""}" data-f="todo">未作答</button>
      <button class="fbtn ${curFilter==="ok"?"active":""}" data-f="ok">已做对</button>
      <button class="fbtn ${curFilter==="bad"?"active":""}" data-f="bad">做错了</button>
    </div>
  </div>`;

  const cards = questions.filter(q=>q.ch===curCh)
    .map(q=>({q, keys: q.type==="group" ? q.subs.map(s=>s.sid) : [q.id]}))
    .filter(c=>matchFilter(c.keys));
  if(!cards.length){
    html += `<div class="empty">当前筛选下暂无题目 🍃</div>`;
  }else{
    for(const lv of [0,1,2,3,4]){
      const part = cards.filter(c=>c.q.level===lv);
      if(!part.length) continue;
      const m = LEVEL_META[lv];
      const count = part.reduce((a,c)=>a+(c.q.type==="group"?c.q.subs.length:1),0);
      html += `<div class="lv-group ${m.cls}"><span class="lv-badge ${m.cls}">${lv===4?"📖":"Lv"+lv}</span><h3>${m.name}</h3><span class="desc">${m.desc} · ${count} 问</span></div>`;
      part.forEach(c=>{
        html += c.q.type==="group" ? renderGroupCard(c.q) : renderSingle(c.q, c.q.id, questions.indexOf(c.q), false);
      });
    }
  }

  const prev = CHAPTERS.find(c=>c.n===curCh-1), next = CHAPTERS.find(c=>c.n===curCh+1);
  html += `<div class="pager">
    ${prev?`<button class="btn ghost" data-goto="${prev.n}">← ${prev.t}</button>`:`<span></span>`}
    ${next?`<button class="btn ghost" data-goto="${next.n}">${next.t} →</button>`:`<span></span>`}
  </div>`;
  main.innerHTML = html;
  renderNav(); refreshStats();
}

/* ---------- 渲染：侧栏与统计 ---------- */
function renderNav(){
  const nav = $("#nav");
  nav.innerHTML = CHAPTERS.map(c=>{
    const items = expandCh(c.n), n = items.length;
    const done = items.filter(i=>store.ans[i.key]).length;
    const okc  = items.filter(i=>store.ans[i.key]&&store.ans[i.key].ok).length;
    const dot = done===0?"":(okc===n?"done-ok":(done===n?"done-bad":"part"));
    return `<button class="nav-item ${c.n===curCh?"active":""}" data-goto="${c.n}" title="${c.t}（满分 ${n}）">
      <span class="dot ${dot}"></span><span class="num">${c.t}</span><span class="cnt">${done}/${n}</span></button>`;
  }).join("");
}
function refreshStats(){
  const all = expandAll();
  const total = all.length;
  const done = all.filter(i=>store.ans[i.key]).length;
  const ok = all.filter(i=>store.ans[i.key]&&store.ans[i.key].ok).length;
  $("#stat-total").textContent = `共 ${total} 问`;
  $("#stat-done").textContent = `已做 ${done}`;
  $("#stat-ok").textContent = `正确 ${ok}`;
  $("#stat-rate").textContent = done? `正确率 ${Math.round(ok/done*100)}%` : "正确率 —";
  $("#stat-bar").style.width = (total? done/total*100:0)+"%";
  const hb = $("#btn-hist");
  if (hb) hb.textContent = `📊 历史成绩 ${(store.log||[]).length}`;
}

/* ---------- 历史成绩档案（重置不清除，跨轮次累计） ---------- */
function fmtTime(ts){
  const d = new Date(ts), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderHistory(){
  const log = store.log || [];
  const total = log.length;
  const ok = log.filter(e=>e.ok).length;
  const rate = total? Math.round(ok/total*100) : 0;
  const last = total? fmtTime(log[log.length-1].ts) : "—";
  let html = `<div class="hist-overview">
    <div class="hist-card"><b>${total}</b><span>累计做题次数</span></div>
    <div class="hist-card"><b>${total? rate+"%" : "—"}</b><span>历史总正确率</span></div>
    <div class="hist-card"><b>${ok}</b><span>累计答对</span></div>
    <div class="hist-card"><b style="font-size:15px;line-height:1.9">${last}</b><span>最近做题时间</span></div>
  </div>`;

  html += `<div class="hist-sec">📌 分章累计（历次合计 · 重置不清除）</div>
    <table class="hist-tbl"><tr><th>章节</th><th>次数</th><th>正确</th><th>正确率</th><th style="width:34%">分布</th></tr>`;
  for(let c=1;c<=11;c++){
    const rows = log.filter(e=>e.ch===c);
    const oc = rows.filter(e=>e.ok).length;
    const pct = rows.length? Math.round(oc/rows.length*100) : 0;
    html += `<tr><td>第 ${c} 章</td><td>${rows.length}</td><td>${oc}</td><td>${rows.length? pct+"%" : "—"}</td>
      <td><div class="hist-bar"><i style="width:${pct}%"></i></div></td></tr>`;
  }
  html += `</table>`;

  const days = {};
  const now = new Date();
  for(let i=0;i<7;i++){
    const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    days[k] = {n:0, ok:0, label:`${d.getMonth()+1}/${d.getDate()}`};
  }
  log.forEach(e=>{
    const d = new Date(e.ts);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    if(days[k]){ days[k].n++; if(e.ok) days[k].ok++; }
  });
  html += `<div class="hist-sec">📅 近 7 天</div>
    <table class="hist-tbl"><tr><th>日期</th><th>做题数</th><th>正确率</th></tr>`;
  Object.values(days).forEach(d=>{
    html += `<tr><td>${d.label}</td><td>${d.n}</td><td>${d.n? Math.round(d.ok/d.n*100)+"%" : "—"}</td></tr>`;
  });
  html += `</table>`;

  html += `<div class="hist-sec">🕘 最近记录（最新在前 · 最多 30 条）</div><div class="hist-log">`;
  const recent = log.slice(-30).reverse();
  if(!recent.length) html += `<div class="hist-empty">还没有做题记录，去刷第一题吧 🍃（从现在起，每一笔成绩都会永久记账）</div>`;
  recent.forEach(e=>{
    html += `<div class="row"><span class="t">${fmtTime(e.ts)}</span><span class="chp">第${e.ch}章</span><span class="k">${e.key}</span><span class="mark" style="color:${e.ok?"var(--ok)":"var(--bad)"}">${e.ok?"✓ 正确":"✗ 错误"}</span></div>`;
  });
  html += `</div>`;

  $("#hist-body").innerHTML = html;
}
function openHistory(){ renderHistory(); $("#hist-mask").classList.add("show"); }
function closeHistory(){ $("#hist-mask").classList.remove("show"); }

/* ---------- 提交（单题与大题小问通用，key 唯一） ---------- */
function submitAnswer(key){
  const ent = INDEX[key];
  const q = ent && ent.q;
  if(!q || store.ans[key]) return;
  let user, res, ok;

  if(q.type==="choice"){
    const sel = document.querySelector(`input[name="o-${key}"]:checked`);
    if(sel===null){ flashVerdict(key, "⚠️ 请先选择一个选项", "bad"); return; }
    user = +sel.value; ok = user===q.answer;
  }else if(q.type==="code"){
    const boxes = [...document.querySelectorAll(`textarea[data-q="${key}"]`)];
    const arr = [];
    boxes.forEach(b=>{ arr[+b.dataset.l] = b.value; });
    if(arr.every(v=>norm(v)==="")){ flashVerdict(key, "⚠️ 请先补写代码再提交", "bad"); return; }
    res = gradeCode(q, arr); ok = isAllCorrect(q, res);
    user = arr;
  }else{
    const inputs = [...document.querySelectorAll(`input[data-q="${key}"]`)];
    const arr = inputs.map(i=>i.value);
    if(arr.every(v=>norm(v)==="")){ flashVerdict(key, "⚠️ 请先填写所有空位", "bad"); return; }
    res = gradeFill(q, arr); ok = isAllCorrect(q, res);
    user = arr;
  }
  store.ans[key] = {user, ok, res:res||null, ts:Date.now()};
  const entCh = ent.grp ? ent.grp.ch : q.ch;
  const entLv = ent.grp ? ent.grp.level : q.level;
  store.log.push({ts:Date.now(), key, ch:entCh, lv:entLv, ok});   /* 历史档案：重置不清除 */
  save();
  renderChapter();
  const card = document.getElementById("card-"+key);
  if(card) card.scrollIntoView({behavior:"smooth", block:"center"});
}
function flashVerdict(qid, msg, cls){
  const vd = document.getElementById("vd-"+qid);
  if(vd){ vd.className = "verdict show "+cls; vd.textContent = msg; }
}

/* ---------- 事件委托 ---------- */
document.addEventListener("click", e=>{
  if(e.target.closest("#btn-hist")){ openHistory(); return; }
  if(e.target.closest("#btn-hist-close")){ closeHistory(); return; }
  if(e.target.id === "hist-mask"){ closeHistory(); return; }
  const goto = e.target.closest("[data-goto]");
  if(goto){
    curCh = +goto.dataset.goto;
    try{ history.replaceState(null,"","#ch"+curCh); }catch(_){}
    renderChapter();
    window.scrollTo({top:0, behavior:"smooth"});
    return;
  }
  const fb = e.target.closest(".fbtn");
  if(fb){ curFilter = fb.dataset.f; renderChapter(); return; }
  const sub = e.target.closest('[data-act="submit"]');
  if(sub){ submitAnswer(sub.dataset.q); return; }
  const rch = e.target.closest('[data-act="reset-ch"]');
  if(rch){
    const items = expandCh(curCh);
    if(confirm(`确定重置「第 ${curCh} 章试卷」的做题记录吗？（共 ${items.length} 问，不影响其他章）`)){
      items.forEach(it=>{ delete store.ans[it.key]; });
      save(); renderChapter();
    }
    return;
  }
  if(e.target.closest("#btn-reset")){
    const total = expandAll().length;
    if(confirm("确定清空全部做题记录吗？此操作不可恢复。") && confirm(`再次确认：真的要重置全部 ${total} 问的记录？（📊 历史成绩档案会保留）`)){
      store = {ans:{}, log:store.log||[]}; save(); renderChapter();
    }
    return;
  }
  /* 点选项卡片即选中（radio 藏起来了） */
  const opt = e.target.closest(".opt");
  if(opt && !opt.classList.contains("reveal-ok") && !opt.classList.contains("reveal-bad")){
    const r = opt.querySelector("input"); if(r && !r.disabled) r.checked = true;
    const box = opt.parentElement;
    box.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
    opt.classList.add("sel");
  }
});
/* 回车快捷提交填空 */
document.addEventListener("keydown", e=>{
  if(e.key === "Escape") closeHistory();
  if(e.key==="Enter" && e.target.matches("input.blank input, .blank input")){
    const qid = e.target.dataset.q;
    const btn = document.querySelector(`[data-act="submit"][data-q="${qid}"]`);
    if(btn) btn.click();
  }
});

/* ---------- 启动 ---------- */
(function init(){
  const m = location.hash.match(/^#ch(\d+)$/);
  if(m && CHAPTERS.some(c=>c.n===+m[1])) curCh = +m[1];
  if(!byChapter(curCh).length && questions.length) curCh = questions[0].ch;
  renderChapter();
})();
</script>
